[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-log-analysis-lab"
version = "0.1.0"
description = "Laboratório de investigação de autenticação Windows (4624/4625) para estudo de SOC/Blue Team"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
authlab = "authlab.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authlab = ["resources/config/*.yaml", "resources/scenarios/*.md", "resources/scenarios/*/*.csv", "resources/scenarios/*/*.json", "resources/scenarios/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
